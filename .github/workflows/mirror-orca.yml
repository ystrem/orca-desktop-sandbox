name: Mirror Orca Linux AppImage

# Orca already ships official AppImages. This workflow watches stablyai/orca
# releases and re-publishes the Linux AppImage to this repo so the sandboxed
# launcher can update with: orca-desktop-sandbox --update

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours
  workflow_dispatch:
    inputs:
      force_mirror:
        description: 'Force mirror even if tag already exists'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/mirror-orca.yml'

permissions:
  contents: write

env:
  UPSTREAM_REPO: stablyai/orca
  # Official asset name used by onorca.dev / docs
  APPIMAGE_NAME: orca-linux.AppImage

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sandbox repository
        uses: actions/checkout@v4

      - name: Check upstream stablyai/orca latest stable release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          UPSTREAM_JSON=$(curl -fsSL -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${UPSTREAM_REPO}/releases/latest")

          TAG=$(echo "${UPSTREAM_JSON}" | jq -r '.tag_name')
          if [ -z "${TAG}" ] || [ "${TAG}" = "null" ]; then
            echo "Could not resolve upstream latest tag"
            exit 1
          fi

          # Prefer explicit orca-linux.AppImage; fall back to any *.AppImage
          ASSET_URL=$(echo "${UPSTREAM_JSON}" | jq -r \
            --arg n "${APPIMAGE_NAME}" \
            '.assets[] | select(.name == $n) | .browser_download_url' | head -n1)
          ASSET_NAME="${APPIMAGE_NAME}"

          if [ -z "${ASSET_URL}" ] || [ "${ASSET_URL}" = "null" ]; then
            ASSET_URL=$(echo "${UPSTREAM_JSON}" | jq -r \
              '.assets[] | select(.name | test("(?i)\\.AppImage$")) | .browser_download_url' | head -n1)
            ASSET_NAME=$(echo "${UPSTREAM_JSON}" | jq -r \
              '.assets[] | select(.name | test("(?i)\\.AppImage$")) | .name' | head -n1)
          fi

          if [ -z "${ASSET_URL}" ] || [ "${ASSET_URL}" = "null" ]; then
            echo "No AppImage asset found in ${UPSTREAM_REPO} ${TAG}"
            echo "${UPSTREAM_JSON}" | jq -r '.assets[].name'
            exit 1
          fi

          OUR_TAG="orca-${TAG}"
          EXISTS=$(curl -fsSL -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${OUR_TAG}" \
            2>/dev/null | jq -r '.tag_name // empty' || true)

          FORCE="${{ github.event.inputs.force_mirror }}"
          if [ "${FORCE}" = "true" ] || [ -z "${EXISTS}" ]; then
            echo "MIRROR_NEEDED=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Release ${OUR_TAG} already exists — skip"
            echo "MIRROR_NEEDED=false" >> "${GITHUB_OUTPUT}"
          fi

          echo "UPSTREAM_TAG=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "OUR_TAG=${OUR_TAG}" >> "${GITHUB_OUTPUT}"
          echo "ASSET_URL=${ASSET_URL}" >> "${GITHUB_OUTPUT}"
          echo "ASSET_NAME=${ASSET_NAME}" >> "${GITHUB_OUTPUT}"
          echo "Upstream ${TAG} → ${ASSET_NAME}"

      - name: Download AppImage & checksum
        if: steps.check.outputs.MIRROR_NEEDED == 'true'
        id: download
        run: |
          set -euo pipefail
          mkdir -p dist
          OUT="dist/${{ steps.check.outputs.ASSET_NAME }}"
          curl -fL --retry 3 --retry-delay 2 -o "${OUT}" \
            "${{ steps.check.outputs.ASSET_URL }}"
          chmod +x "${OUT}"
          SHA256=$(sha256sum "${OUT}" | awk '{print $1}')
          SIZE=$(stat -c%s "${OUT}")
          echo "SHA256=${SHA256}" >> "${GITHUB_OUTPUT}"
          echo "SIZE=${SIZE}" >> "${GITHUB_OUTPUT}"
          echo "PATH=${OUT}" >> "${GITHUB_OUTPUT}"
          echo "Downloaded ${OUT} (${SIZE} bytes) sha256:${SHA256}"

      - name: Create GitHub Release
        if: steps.check.outputs.MIRROR_NEEDED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check.outputs.OUR_TAG }}
          name: "Orca ${{ steps.check.outputs.UPSTREAM_TAG }} (sandboxed mirror)"
          body: |
            ### Orca Desktop AppImage mirror

            Unmodified official Linux AppImage from upstream [stablyai/orca](https://github.com/stablyai/orca).

            | Field | Value |
            | --- | --- |
            | Upstream tag | `${{ steps.check.outputs.UPSTREAM_TAG }}` |
            | Asset | `${{ steps.check.outputs.ASSET_NAME }}` |
            | SHA256 | `${{ steps.download.outputs.SHA256 }}` |
            | Size | `${{ steps.download.outputs.SIZE }}` bytes |

            Upstream release: https://github.com/stablyai/orca/releases/tag/${{ steps.check.outputs.UPSTREAM_TAG }}

            #### Usage with the sandbox

            ```bash
            orca-desktop-sandbox --update
            orca-desktop-sandbox
            ```

            This repository only provides Firejail isolation profiles. The binary is the upstream release.
          files: ${{ steps.download.outputs.PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
